<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="form.css">
    <title>Fishing - Enciclopédia Marítima</title>
</head>

<body>
    <header class="cabecalho-principal">

        <div class="cabecalho-logo">
            <img class="cabecalho-logo__img" src="https://i.postimg.cc/xdT5q55k/fishing-rod.png" alt="Logo Fishing">
            <h1 class="cabecalho-logo__titulo">Fishing</h1>
        </div>

        <nav class="cabecalho-nav">
            <ul class="nav__lista">
                <li class="nav__item"><a href="index.html" class="nav__link">Início</a></li>
                <li class="nav__item"><a href="form.html" class="nav__link">Cadastro</a></li>
            </ul>
        </nav>

    </header>

    <section class="formulario-principal">
        <form class="formulario">
            <div class="formulario__linha">
                <div class="campo-input">
                    <label for="nome_popular">Nome do Peixe</label>
                    <input type="text" id="nome_popular" placeholder="Ex: Tambaqui" required>
                </div>
                <div class="campo-input">
                    <label for="nome_cientifico">Nome Científico</label>
                    <input type="text" id="nome_cientifico" placeholder="Ex: Colossoma macropomum" required>
                </div>
            </div>

            <div class="formulario__linha">
                <div class="campo-input">
                    <label for="habitat_peixe">Habitat</label>
                    <input type="text" id="habitat_peixe" placeholder="Ex: Águas Rasas" required>
                </div>
                <div class="campo-input">
                    <label for="nutricao_peixe">Nutrição</label>
                    <input type="text" id="nutricao_peixe" placeholder="Ex: Frutos, Algas" required>
                </div>
            </div>

            <div class="campo-input">
                <label for="descricao_descoberta">Descrição da Descoberta</label>
                <textarea id="descricao_descoberta" rows="4" placeholder="Descreva o comportamento e detalhes específicos..."></textarea>
            </div>

        </form>
    </section>
</body>
</html>
